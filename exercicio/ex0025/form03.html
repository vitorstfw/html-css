<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario 3</title>
</head>
<body>
    <h1>teste de formulario</h1>
    <form action="cadastro.php" method="get">
<p>
    <label for="inome">Nome</label>
    <input type="text" name="nome" id="inome" required size="30" maxlength="50" placeholder="Digite seu nome completo" autocomplete="name">
</p>

<p>
    <label for="imes"> mes</label>
    <input type="month" name="mes" id="imes">
</p>

<p><label for="ihora">Horas</label>
<input type="time" name="Horas" id="ihora">
</p>

<p>
<label for="idate"> data e horas</label>
<input type="datetime" name="date" id="idate">
</p>

<p>
    <label for="idia">Dia</label>
    <input type="date" name="dia" id="idia">
</p>

<p>
    <label for="imedia">média</label>
    <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" value="5" step="0.1">
</p>

<p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
</p>

    </form>
</body>
</html>
