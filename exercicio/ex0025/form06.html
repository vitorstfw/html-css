<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="off">

<p>
<label for="icor">cor:</label>
<input type="color" name="cor" id="icor">

</p>

<p>
<label for="inevel">Nivel de Satisfação:</label>
<input type="range" name="Nivel" id="inivel" min="0" max="10" step="1" value="5">
</p>

<p>
    <label for="ifoto">foto do perfil:</label>
    <input type="file" name="foto" id="ifoto">
</p>

<p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
</p>

    </form>
</body>
</html>
